# Pre-commit hooks for C/C++ project
# Install: pacman -S python-pre-commit
# Setup: pre-commit install && pre-commit install --hook-type commit-msg

repos:
  # C/C++ formatting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # C/C++ static analysis
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-tidy
        args: [--config-file=.clang-tidy]
      - id: cppcheck
        args: [--enable=warning,style,performance,portability, --suppress=missingIncludeSystem]

  # Memory safety
  - repo: local
    hooks:
      - id: valgrind
        name: valgrind memcheck
        language: script
        entry: tools/profiler/run-memcheck.sh
        pass_filenames: false
        types_or: [c++, c]

  # Conventional commits
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.24.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
