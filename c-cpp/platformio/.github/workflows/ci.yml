name: PlatformIO CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Setup Arch Linux
        run: |
          pacman -Syu --noconfirm
          pacman -Sy --noconfirm git python python-pre-commit

      - uses: actions/checkout@v6

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        device:
          - arduino-nano
          - esp32-devkit
          - esp8266-wemos-d1-mini
          - rpi-pico
          - stm32f411-blackpill

    steps:
      - name: Setup Arch Linux
        run: |
          pacman -Syu --noconfirm
          pacman -Sy --noconfirm git python python-pip

      - uses: actions/checkout@v6

      - name: Install PlatformIO Core
        run: |
          pip install --upgrade pip --break-system-packages
          pip install platformio --break-system-packages

      - name: Generate project for ${{ matrix.device }}
        run: |
          mkdir -p /tmp/no-docker
          printf '#!/bin/sh\nexit 1\n' > /tmp/no-docker/docker
          chmod +x /tmp/no-docker/docker
          PATH="/tmp/no-docker:$PATH" ./new-project.sh \
              --c-cpp --platformio --${{ matrix.device }} \
              "/tmp/project-${{ matrix.device }}"

      - name: Build firmware
        run: |
          cd "/tmp/project-${{ matrix.device }}"
          pio run
