name: Generator smoke test

on:
  push:
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Setup Arch Linux
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git python python-pip

      - uses: actions/checkout@v6

      - name: Configure git identity
        run: |
          git config --global user.name "VVPT CI"
          git config --global user.email "ci@example.com"

      - name: Stub docker and uv
        run: |
          mkdir -p /tmp/stubs
          printf '#!/bin/sh\nexit 1\n' > /tmp/stubs/docker
          printf '#!/bin/sh\nexit 0\n' > /tmp/stubs/uv
          chmod +x /tmp/stubs/docker /tmp/stubs/uv

      - name: Scaffold C/C++ pure
        run: |
          PATH="/tmp/stubs:$PATH" ./new-project.sh --c-cpp --pure /tmp/t-cpp

      - name: Scaffold Python pure
        run: |
          PATH="/tmp/stubs:$PATH" ./new-project.sh --python --pure /tmp/t-py

      - name: Scaffold PlatformIO
        run: |
          PATH="/tmp/stubs:$PATH" ./new-project.sh --c-cpp --platformio --esp32-devkit /tmp/t-pio

      - name: Scaffold Verilog
        run: |
          PATH="/tmp/stubs:$PATH" ./new-project.sh --verilog --pure /tmp/t-v

      - name: Scaffold Verilog with a Dev Container
        run: |
          PATH="/tmp/stubs:$PATH" ./new-project.sh --verilog --pure --dev-container /tmp/t-v-dc

      - name: Scaffold without a container
        run: |
          PATH="/tmp/stubs:$PATH" ./new-project.sh --c-cpp --pure --no-container /tmp/t-nc

      - name: Scaffold without VS Code
        run: |
          PATH="/tmp/stubs:$PATH" ./new-project.sh --c-cpp --pure --dev-container --no-vscode /tmp/t-nv

      - name: Verify scaffolding
        run: |
          set -eu

          for project in /tmp/t-cpp /tmp/t-py /tmp/t-pio /tmp/t-v
          do
            test -L "$project/CLAUDE.md"
            test -L "$project/QWEN.md"
            test -L "$project/AGENTS.md"
            test -f "$project/.devcontainer/Dockerfile"
            test -x "$project/.devcontainer/run.sh"
            test ! -f "$project/.devcontainer/devcontainer.json"
            test "$(git -C "$project" branch --show-current)" = "main"
          done

          test -f /tmp/t-cpp/CMakeLists.txt
          test -f /tmp/t-py/pyproject.toml
          test -f /tmp/t-pio/platformio.ini
          test -f /tmp/t-pio/.gitignore
          test -f /tmp/t-pio/.pre-commit-config.yaml
          test -f /tmp/t-pio/.github/workflows/ci.yml
          test -f /tmp/t-v/rtl/blink.v
          test -f /tmp/t-v/quartus/t-v.qpf
          test ! -f /tmp/t-v/.devcontainer/devcontainer.json
          test -f /tmp/t-v-dc/.devcontainer/devcontainer.json
          test -f /tmp/t-v-dc/.devcontainer/Dockerfile

          test ! -e /tmp/t-nc/.devcontainer
          test -f /tmp/t-nc/.vscode/tasks.json
          ! grep -q "run.sh" /tmp/t-nc/.vscode/tasks.json
          ! grep -q "Container: build image" /tmp/t-nc/.vscode/tasks.json

          test ! -e /tmp/t-nv/.vscode
          test -f /tmp/t-nv/.devcontainer/devcontainer.json
          ! grep -q "customizations" /tmp/t-nv/.devcontainer/devcontainer.json
