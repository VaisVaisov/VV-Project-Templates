# Pre-commit hooks
# Install: pacman -S python-pre-commit
# Setup: pre-commit install

repos:
  # Verilog lint (requires verilator on PATH)
  - repo: local
    hooks:
      - id: verilator-lint
        name: verilator lint
        entry: bash -c 'verilator --lint-only -Wall rtl/*.v'
        language: system
        files: ^rtl/.*\.(v|sv)$
        pass_filenames: false

  # General checks (keep for all templates)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
